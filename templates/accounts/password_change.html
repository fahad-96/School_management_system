{% extends 'base.html' %}
{% block title %}Change password{% endblock %}
{% block content %}
<h3 class="mb-3">Change password</h3>
<div class="card" style="max-width: 560px">
  <div class="card-body">
    <form method="post">{% csrf_token %}{% include 'includes/form.html' %}
      <button class="btn btn-primary mt-3">Update password</button>
      <a class="btn btn-link mt-3" href="{% url 'dashboard' %}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
